<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>銀髮健康日記簿</title>
  <meta name="description" content="專為長輩設計的三餐飲食紀錄：點選食物、記錄喝水與精神狀況，一眼看出今天吃得夠不夠均衡。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="btnAdmin" class="admin-btn" type="button" aria-label="管理員登入" title="管理員登入"><span aria-hidden="true">👤</span><span class="lbl">管理員</span></button>
      <h1>🍚 銀髮健康日記簿</h1>
      <div class="size-ctl" role="group" aria-label="調整字體大小">
        <button id="fontDown" type="button" aria-label="字體縮小">A−</button>
        <button id="fontUp" type="button" aria-label="字體放大">A＋</button>
      </div>
    </div>
  </header>
  <div class="tabbar">
    <nav class="tabs" role="tablist" aria-label="頁面選單">
      <button role="tab" data-tab="today" type="button"><span class="ti" aria-hidden="true">📝</span><span>今天</span></button>
      <button role="tab" data-tab="week" type="button"><span class="ti" aria-hidden="true">📅</span><span>近七天</span></button>
      <button role="tab" data-tab="care" type="button"><span class="ti" aria-hidden="true">💊</span><span>看診用藥</span></button>
      <button role="tab" data-tab="tips" type="button"><span class="ti" aria-hidden="true">💡</span><span>小叮嚀</span></button>
    </nav>
  </div>

  <div id="alerts" class="alerts" aria-live="assertive"></div>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    <p>資料自動儲存在這台電腦／手機的瀏覽器中，不會上傳到網路。</p>
    <div class="foot-btns">
      <button type="button" id="btnInvite">✉️ 邀請家人朋友</button>
      <button type="button" id="btnPrint">🖨️ 列印</button>
      <button type="button" id="btnExport">💾 備份資料</button>
      <button type="button" id="btnImport">📂 還原備份</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
    <p class="small">本網站僅供飲食記錄與一般衛教參考，不能取代醫師或營養師的建議。</p>
  </footer>

  <dialog id="picker" class="sheet" aria-labelledby="pickerTitle"></dialog>
  <dialog id="invite" class="sheet" aria-labelledby="inviteTitle"></dialog>
  <dialog id="admin" class="sheet" aria-labelledby="adminTitle"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
